---
name: Test image

on:
  workflow_call:
    inputs:
      version_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test rocky${{ inputs.version_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout out the codebase
        uses: actions/checkout@v7

      - name: Test building image
        run: |
          version="${{ inputs.version_branch }}"
          branch="${version%%.*}"
          podman build -t docker-rockylinux-ansible:"$version" ./rocky"$branch"/. --build-arg VERSION="$version"

      - name: Run the built image
        run: |
          version="${{ inputs.version_branch }}"
          podman run --name test-container --detach --privileged --volume /sys/fs/cgroup:/sys/fs/cgroup:ro docker-rockylinux-ansible:"$version"

      - name: Verify Ansible is accessible in the built image
        run: podman exec --tty test-container env TERM=xterm ansible --version